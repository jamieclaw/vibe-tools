[package]
name = "fluid-sim"
version = "0.1.0"
edition = "2021"
authors = ["Jamie <jamieclaw@users.noreply.github.com>"]
description = "PIC/FLIP fluid simulator (2D + 3D) compiled to WASM"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
