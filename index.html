<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibe-tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0d1b2a;
    color: #e0e1dd;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(76,201,240,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(247,37,133,0.12) 0%, transparent 50%);
  }
  header { text-align: center; margin-bottom: 50px; }
  h1 {
    font-size: clamp(36px, 6vw, 56px);
    font-weight: 800;
    background: linear-gradient(135deg, #4cc9f0, #f72585);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.02em;
  }
  header p { margin-top: 8px; opacity: 0.6; font-size: 15px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    max-width: 800px;
    width: 100%;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 28px 24px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s ease;
    display: block;
  }
  .card:hover {
    background: rgba(76,201,240,0.08);
    border-color: rgba(76,201,240,0.4);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card .emoji { font-size: 36px; margin-bottom: 14px; display: block; }
  .card h2 { font-size: 18px; margin-bottom: 6px; }
  .card p { font-size: 13px; opacity: 0.7; line-height: 1.5; }
  footer { margin-top: 60px; font-size: 12px; opacity: 0.4; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>vibe-tools</h1>
  <p>tiny browser experiments</p>
</header>

<div class="grid">
  <a class="card" href="minecraft.html">
    <span class="emoji">⛏️</span>
    <h2>Voxel Mini</h2>
    <p>A bite-size Minecraft clone. WASD + mouse, break and place blocks, build whatever.</p>
  </a>
  <a class="card" href="water.html">
    <span class="emoji">💧</span>
    <h2>Water Physics</h2>
    <p>SPH-style 2D fluid simulator with live-adjustable gravity, viscosity, pressure & damping.</p>
  </a>
</div>

<footer>
  <a href="https://github.com/jamieclaw/vibe-tools">github.com/jamieclaw/vibe-tools</a>
</footer>
</body>
</html>
